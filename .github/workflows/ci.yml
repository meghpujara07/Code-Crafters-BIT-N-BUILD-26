name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cloudops
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Wait for DB
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 3
          done
      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cloudops
        run: alembic upgrade head
      - name: Run lint
        run: ruff check .
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cloudops
        run: pytest backend/tests/p2 -q
      - name: Export OpenAPI
        run: python -m app.export_openapi
      - name: Check OpenAPI drift
        run: |
          git diff --exit-code contracts/openapi.json || (echo "OpenAPI drift detected" && exit 1)
      - name: Smoke test
        run: |
          ./scripts/wait_for_health.sh && python scripts/smoke_api.py --base http://localhost/api/v1 --group read
