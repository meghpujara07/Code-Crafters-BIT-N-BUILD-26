services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloudops
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
      POSTGRES_DB: cloudops
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudops -d cloudops"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://cloudops:${DB_PASSWORD:-change_me}@db:5432/cloudops
      JWT_SECRET: ${JWT_SECRET:-change_me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SEED_ON_START: ${SEED_ON_START:-true}
      PROVIDER_MODE: ${PROVIDER_MODE:-mock}
      INGESTION_INTERVAL_SECONDS: ${INGESTION_INTERVAL_SECONDS:-60}
      ENABLE_DEMO_CONTROLS: ${ENABLE_DEMO_CONTROLS:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      INTERNAL_API_BASE: ${INTERNAL_API_BASE:-http://127.0.0.1:8000/api/v1}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_WS_URL: ""
        VITE_USE_MOCKS: "false"
    ports:
      - "80:80"
    depends_on:
      - backend
volumes:
  db_data:
